<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validation with model — NoJS Elements E2E</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; color: #333; }
    section { border: 1px solid #ccc; padding: 1rem; margin-bottom: 1.5rem; border-radius: 4px; }
    .test-label { font-weight: 600; margin: 0 0 0.75rem; color: #555; }
    label { display: block; margin-bottom: 0.5rem; }
    .error { color: #b00020; }
  </style>
</head>
<body>

  <!-- ======== Scenario 1: model + field-level validate-on="blur" ======== -->
  <section>
    <p class="test-label">Test 1: model with validate-on="blur" posts the typed values</p>
    <form validate post="/api/login" state="{ email: '', password: '' }" data-test="blur-form">
      <label>Email
        <input name="email" model="email" type="email" validate="required,email" validate-on="blur"
               error-required="Email is required" error-email="Enter a valid email" data-test="blur-email">
      </label>
      <span class="error" if="$form.errors.email" bind="$form.errors.email" data-test="blur-email-error"></span>
      <label>Password
        <input name="password" model="password" type="password" validate="required,min:8" data-test="blur-password">
      </label>
      <button type="submit" data-test="blur-submit">Log In</button>
    </form>
  </section>

  <!-- ======== Scenario 2: model + validate-on="input" ======== -->
  <section>
    <p class="test-label">Test 2: model with validate-on="input" keeps every keystroke</p>
    <form validate state="{ name: '' }" data-test="input-form">
      <label>Name
        <input name="name" model="name" validate="required" validate-on="input" data-test="input-name">
      </label>
      <p>Echo: <span bind="name" data-test="input-echo"></span></p>
    </form>
  </section>

  <script src="../../NoJS/dist/iife/no.js"></script>
  <script src="../../dist/iife/nojs-elements.js"></script>
  <script>
    NoJS.use(NoJSElements);
    NoJS.init();
  </script>
</body>
</html>
